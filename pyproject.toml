[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cinematic-prompt-formatter"
version = "0.1.0"
description = "Translate cinematic language into weighted prompt tags for Stable Diffusion, Flux, and SDXL"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Cinematic Prompt Formatter Contributors"}
]
keywords = ["stable-diffusion", "flux", "sdxl", "prompt-engineering", "cinematography", "ai-art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cpf = "formatter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["formatter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]